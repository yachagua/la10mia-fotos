# Publica el optimizador de fotos en Azure Functions (plan Flex Consumption).
# Azure instala las librerías de requirements.txt durante la publicación (remote-build),
# que es lo que necesita el plan Flex Consumption para encontrar la función.

name: Build and deploy Python project to Azure Function App - func-la10mia-fotos

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # necesario para iniciar sesión en Azure sin contraseñas
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_29DD054B1B984761A98D5609B2A8E948 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_29057C0E99BA40628D4CE46919698C39 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B7334B970EFD47A48BCA2ECF742AB21D }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'func-la10mia-fotos'
          package: '.'
          sku: 'flexconsumption'
          remote-build: 'true'
